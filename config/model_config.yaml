model:
  lookback: 72
  df: 5.0
  interval_scale: 1.05
  volatility_model: ensemble
  distribution: student_t
  use_regimes: true
  conformal_enabled: false

volatility:
  ewma_span: 72
  garch_alpha: 0.08
  garch_beta: 0.90
  ensemble_rolling_weight: 0.35
  ensemble_ewma_weight: 0.35
  ensemble_garch_weight: 0.30

regimes:
  regime_lookback: 240
  low_vol_percentile: 33
  high_vol_percentile: 67
  low_regime_df: 10.0
  high_regime_df: 4.0
  low_regime_scale: 0.92
  high_regime_scale: 1.12

calibration:
  method: grid
  target_coverage: 0.95
  validation_window: 720
  conformal_alpha: 0.05
  conformal_min_history: 60

data:
  source: binance_vision
  symbol: BTCUSDT
  interval: 1h
  features:
    - close
    - volume
    - technical_indicators
    - taker_buy_ratio

